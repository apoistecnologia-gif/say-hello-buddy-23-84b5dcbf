name: APOIS Passageiro - voltar inicio apos cancelamento

on:
  push:
    branches:
      - feat/apois-passageiro-completo
    paths:
      - ".github/workflows/apois-passenger-cancel-return-home-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/apois-passageiro-completo
      - name: Corrigir retorno apos cancelar
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/_authenticated.corrida.$rideId.tsx')
          s=p.read_text()
          old='''        onSuccess={() => {\n          setIsCancelDialogOpen(false);\n          void loadRide(ride.id);\n        }}'''
          new='''        onSuccess={() => {\n          setIsCancelDialogOpen(false);\n          clearRide();\n          void navigate({ to: "/inicio", replace: true });\n        }}'''
          if old not in s: raise RuntimeError('onSuccess de cancelamento nao encontrado')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validar
        run: |
          grep -F 'void navigate({ to: "/inicio", replace: true });' 'src/routes/_authenticated.corrida.$rideId.tsx'
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/_authenticated.corrida.$rideId.tsx'
          git commit -m "fix(passageiro): retornar ao inicio apos cancelamento"
          git push origin HEAD:feat/apois-passageiro-completo
