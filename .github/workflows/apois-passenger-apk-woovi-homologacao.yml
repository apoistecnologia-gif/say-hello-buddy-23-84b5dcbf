name: APOIS Passageiro - APK Woovi homologação

on:
  push:
    branches:
      - feat/woovi-processing-fee
    paths:
      - ".github/workflows/apois-passenger-apk-woovi-homologacao.yml"
      - "src/**"
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apois-passageiro-woovi-homologacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APOIS_HML_REF: breaseovgljypnjrqgep
      APOIS_PROD_REF: vqtucstyduxrqjgyigfk
      VITE_SUPABASE_URL: https://breaseovgljypnjrqgep.supabase.co
      VITE_SUPABASE_PROJECT_ID: breaseovgljypnjrqgep
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cxlIsYKz-MxpaU6USJM8eg_Az99pxVy
      VITE_APOIS_API_URL: https://breaseovgljypnjrqgep.supabase.co/functions/v1
      APOIS_VERSION_CODE: ${{ github.run_number }}
      APOIS_VERSION_NAME: 1.0-woovi-hml.${{ github.run_number }}
      GOOGLE_MAPS_WEB_API_KEY: ${{ secrets.GOOGLE_MAPS_WEB_API_KEY }}
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}

    steps:
      - name: Checkout candidato Woovi
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Restaurar assinatura estável de homologação
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: apois-passageiro-woovi-hml-signing-v1

      - name: Garantir assinatura estável de homologação
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=APOIS Passageiro Woovi HML,O=APOIS,C=BR"
          fi

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Validar entradas públicas da homologação
        run: |
          set -euo pipefail
          test "$VITE_SUPABASE_PROJECT_ID" = "$APOIS_HML_REF"
          test "$VITE_SUPABASE_URL" = "https://${APOIS_HML_REF}.supabase.co"
          test "$VITE_APOIS_API_URL" = "https://${APOIS_HML_REF}.supabase.co/functions/v1"
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *) echo "Publishable key de homologação inválida"; exit 1 ;;
          esac
          test -n "$GOOGLE_MAPS_WEB_API_KEY"
          test -n "$GOOGLE_MAPS_ANDROID_API_KEY"

      - name: Preparar identidade Android exclusiva da homologação
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          capacitor = Path('capacitor.config.ts')
          text = capacitor.read_text(encoding='utf-8')
          text = text.replace('appId: "com.apois.passageiro"', 'appId: "com.apois.passageiro.hml"')
          text = text.replace('appName: "APOIS Passageiro"', 'appName: "APOIS Passageiro HML"')
          capacitor.write_text(text, encoding='utf-8')

          gradle = Path('android/app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          text = text.replace('applicationId "com.apois.passageiro"', 'applicationId "com.apois.passageiro.hml"')
          gradle.write_text(text, encoding='utf-8')

          strings = Path('android/app/src/main/res/values/strings.xml')
          text = strings.read_text(encoding='utf-8')
          text = text.replace('<string name="app_name">APOIS Passageiro</string>', '<string name="app_name">APOIS Passageiro HML</string>')
          text = text.replace('<string name="title_activity_main">APOIS Passageiro</string>', '<string name="title_activity_main">APOIS Passageiro HML</string>')
          text = text.replace('<string name="package_name">com.apois.passageiro</string>', '<string name="package_name">com.apois.passageiro.hml</string>')
          text = text.replace('<string name="custom_url_scheme">com.apois.passageiro</string>', '<string name="custom_url_scheme">com.apois.passageiro.hml</string>')
          strings.write_text(text, encoding='utf-8')
          PY
          grep -F 'appId: "com.apois.passageiro.hml"' capacitor.config.ts
          grep -F 'applicationId "com.apois.passageiro.hml"' android/app/build.gradle
          grep -F 'APOIS Passageiro HML' android/app/src/main/res/values/strings.xml

      - name: Isolar Firebase de produção no passageiro HML
        run: |
          set -euo pipefail
          if [ -f android/app/google-services.json ]; then
            mv android/app/google-services.json android/app/google-services.json.production-only
          fi
          test ! -f android/app/google-services.json

      - name: Typecheck
        run: bun run typecheck

      - name: Testes financeiros Woovi
        run: |
          bun test tests/payment-service.test.ts \
            tests/processing-fee.test.ts \
            tests/woovi-financial-contract.test.ts \
            tests/woovi-provider-switch-runtime.test.ts \
            tests/woovi-webhook-dispatch-contract.test.ts

      - name: Build web contra Supabase Woovi homologação
        run: |
          set -euo pipefail
          export VITE_GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_WEB_API_KEY"
          bun run build

      - name: Confirmar backend realmente empacotado
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, statSync } from 'node:fs';
          import { join } from 'node:path';

          const expectedRef = process.env.APOIS_HML_REF;
          const productionRef = process.env.APOIS_PROD_REF;
          const files = [];
          const walk = (dir) => {
            for (const name of readdirSync(dir)) {
              const path = join(dir, name);
              if (statSync(path).isDirectory()) walk(path);
              else if (/\.(js|html|css)$/.test(name)) files.push(path);
            }
          };
          walk('dist');
          const corpus = files.map((path) => readFileSync(path, 'utf8')).join('\n');
          if (!corpus.includes(expectedRef)) throw new Error('Bundle não contém o Supabase Woovi de homologação.');
          if (corpus.includes(productionRef)) throw new Error('BLOQUEADO: bundle HML contém referência ao Supabase de produção.');
          if (!corpus.includes('woovi-create-ride-pix')) throw new Error('Bundle HML não contém a chamada Pix Woovi esperada.');
          console.log('[passageiro-hml] bundle isolado validado.');
          NODE

      - name: Sync Capacitor Android
        run: |
          set -euo pipefail
          printf 'GOOGLE_MAPS_API_KEY=%s\n' "$GOOGLE_MAPS_ANDROID_API_KEY" > android/local.properties
          bunx cap sync android
          grep -F 'com.apois.passageiro.hml' android/app/build.gradle
          test ! -f android/app/google-services.json

      - name: Compilar APK debug isolado
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Validar APK gerado
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" APOIS-Passageiro-Woovi-Homologacao.apk
          sha256sum APOIS-Passageiro-Woovi-Homologacao.apk
          ls -lh APOIS-Passageiro-Woovi-Homologacao.apk

      - name: Publicar APK candidato Woovi HML
        uses: actions/upload-artifact@v4
        with:
          name: APOIS-Passageiro-Woovi-Homologacao-${{ github.run_number }}
          path: APOIS-Passageiro-Woovi-Homologacao.apk
          if-no-files-found: error
          retention-days: 14
