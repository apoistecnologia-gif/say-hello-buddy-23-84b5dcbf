name: APOIS Navigation - independent regional catalog (no deploy)
on:
  push:
    branches: [lab/apois-navigation-provenance-20261125]
    paths: ['experimental/apois-navigation/import_catalog.py', '.github/workflows/apois-navigation-osm-catalog-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regional-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y osmium-tool
      - name: Extrair somente a região experimental
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/apois-osm-catalog"
          mkdir -p "$D"
          curl --fail --location --retry 1 --connect-timeout 20 --max-time 780 --max-filesize 2000000000 https://download.geofabrik.de/south-america/brazil/nordeste-latest.osm.pbf -o "$D/nordeste.osm.pbf"
          sha256sum "$D/nordeste.osm.pbf" > "$D/source-sha256.txt"
          osmium extract --strategy complete_ways --bbox=-40.80,-9.65,-40.20,-9.10 "$D/nordeste.osm.pbf" -o "$D/vale.osm.pbf"
          rm "$D/nordeste.osm.pbf"
          sha256sum "$D/vale.osm.pbf" > "$D/extract-sha256.txt"
          python3 experimental/apois-navigation/import_catalog.py --extract "$D/vale.osm.pbf" --expected-sha256 "$(sha256sum "$D/vale.osm.pbf" | cut -d' ' -f1)" --version 1 --out "$D/catalog.json"
          rm "$D/vale.osm.pbf"
      - uses: actions/upload-artifact@v4
        with:
          name: apois-independent-osm-catalog
          path: |
            ${{ runner.temp }}/apois-osm-catalog/catalog.json
            ${{ runner.temp }}/apois-osm-catalog/*sha256.txt
          retention-days: 7
