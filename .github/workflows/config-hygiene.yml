name: Config Hygiene

on:
  pull_request:
    branches:
      - main
      - feat/apois-passageiro-completo
  push:
    branches:
      - main
      - feat/apois-passageiro-completo

permissions:
  contents: read

jobs:
  config-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Secret hygiene audit
        run: bun run audit:secrets

      - name: TypeScript
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_validation_placeholder
          VITE_SUPABASE_PROJECT_ID: example-project
          VITE_APOIS_API_URL: https://example.supabase.co/functions/v1
          VITE_GOOGLE_MAPS_API_KEY: ci_validation_placeholder
