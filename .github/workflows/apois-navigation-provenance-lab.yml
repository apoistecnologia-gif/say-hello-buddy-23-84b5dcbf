name: APOIS Navigation - independent provenance lab
on:
  push:
    branches: [lab/apois-navigation-provenance-20261125]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client-and-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test experimental/apois-navigation/client.test.mjs experimental/apois-navigation/ui/passenger-panel.test.mjs experimental/apois-navigation/ui/request-review.test.mjs experimental/apois-navigation/ui/durable-ride-host.test.mjs experimental/apois-navigation/ui/verified-host-transport.test.mjs
      - run: python3 -m unittest discover -s experimental/apois-navigation -p 'test_import_catalog.py' -v
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Iniciar PostgreSQL sem rede
        run: |
          set -euo pipefail
          docker run -d --name apois-provenance-fixture --network none -e POSTGRES_PASSWORD=synthetic_ci_only -e POSTGRES_DB=apois_navigation_fixture postgres:17
          for n in $(seq 1 60); do
            if docker exec apois-provenance-fixture pg_isready -h 127.0.0.1 -U postgres -d apois_navigation_fixture; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Testar SQL no banco descartavel
        run: |
          set -euo pipefail
          for file in fixture.sql schema.sql test.sql; do
            docker exec -i apois-provenance-fixture psql -U postgres -d apois_navigation_fixture -v ON_ERROR_STOP=1 < "experimental/apois-navigation/$file"
          done
      - name: Encerrar fixture
        if: always()
        run: |
          docker logs apois-provenance-fixture || true
          docker rm -f apois-provenance-fixture || true
