name: APOIS Navigation - independent provenance lab
on:
  push:
    branches: [lab/apois-navigation-provenance-20261125]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: apois_navigation_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d apois_navigation_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testar cliente experimental
        run: node --test experimental/apois-navigation/client.test.mjs
      - name: Testar SQL apenas no PostgreSQL descartavel
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: apois_navigation_fixture
          PGUSER: postgres
          PGPASSWORD: synthetic_ci_only
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = apois_navigation_fixture
          psql -v ON_ERROR_STOP=1 -f experimental/apois-navigation/fixture.sql
          psql -v ON_ERROR_STOP=1 -f experimental/apois-navigation/schema.sql
          psql -v ON_ERROR_STOP=1 -f experimental/apois-navigation/test.sql
