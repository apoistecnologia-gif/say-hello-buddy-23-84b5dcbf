name: One-off reconcile cancelled Asaas charge

on:
  push:
    branches:
      - feat/woovi-processing-fee
    paths:
      - ".github/workflows/oneoff-reconcile-orphan-asaas.yml"

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove the single known orphan charge from Asaas
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            -X POST \
            "https://vqtucstyduxrqjgyigfk.supabase.co/functions/v1/finance-oneoff-cancel-orphan-asaas-pix")
          echo "$response"
          echo "$response" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'
