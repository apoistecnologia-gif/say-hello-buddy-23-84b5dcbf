name: APOIS Corridas — Passenger Phase 6

on:
  push:
    branches:
      - fix/apois-corridas-consolidacao
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: apois-passenger-phase6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  passenger-phase6:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Phase 6 contract tests
        run: bun test tests/passenger/phase6-contract.test.ts

      - name: TypeScript
        run: bun run typecheck

      - name: ESLint — Phase 6 passenger surface
        run: |
          bunx eslint \
            'src/types/rides/active-ride.ts' \
            'src/types/rides/ride-history.ts' \
            'src/services/rides/active-ride-service.ts' \
            'src/services/rides/shared-ride-service.ts' \
            'src/services/rides/ride-safety-service.ts' \
            'src/services/rides/ride-rating-service.ts' \
            'src/services/rides/ride-receipt-service.ts' \
            'src/services/rides/ride-history-service.ts' \
            'src/components/rides/active/ApoisSosAction.tsx' \
            'src/components/rides/active/RideSafetyDialog.tsx' \
            'src/components/profile/PassengerProfileCenter.tsx' \
            'src/services/profile/passenger-profile-service.ts' \
            'src/routes/_authenticated.corrida.$rideId.tsx' \
            'src/routes/_authenticated.corridas.$rideId.tsx' \
            'src/lib/auth/password-recovery.ts' \
            'src/lib/auth/native-password-recovery.ts' \
            'tests/passenger/phase6-contract.test.ts'

      - name: Production build
        run: bun run build

      - name: Capacitor passenger build
        run: bun run build:capacitor

      - name: Phase 6 no-dead-placeholder gate
        run: |
          set -euo pipefail
          grep -F 'sharedRideService.createOrRefresh(ride.id)' 'src/routes/_authenticated.corrida.$rideId.tsx'
          grep -F 'passenger_driver_rating' src/services/rides/active-ride-service.ts
          grep -F 'passenger_trigger_sos' src/services/rides/ride-safety-service.ts
          grep -F 'get_passenger_ride_receipt' src/services/rides/ride-receipt-service.ts
          grep -F 'uploadAvatar(file: File)' src/services/profile/passenger-profile-service.ts
          grep -F 'apoispassageiro://auth/redefinir-senha' src/lib/auth/native-password-recovery.ts
          grep -F 'NATIVE_PASSWORD_RECOVERY_REDIRECT' src/lib/auth/password-recovery.ts
          echo 'APOIS_PASSENGER_PHASE6_VALIDATION_OK'
