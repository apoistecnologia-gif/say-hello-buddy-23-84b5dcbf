name: Configure Woovi HML Google secret

on:
  push:
    branches:
      - feat/woovi-processing-fee
    paths:
      - ".github/workflows/configure-woovi-hml-google-secret.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HML_PROJECT_REF: breaseovgljypnjrqgep
      SUPABASE_ACCESS_TOKEN_PRIMARY: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_ACCESS_TOKEN_FALLBACK: ${{ secrets.SUPABASE_TOKEN }}
      GOOGLE_MAPS_PLATFORM_API_KEY_SECRET: ${{ secrets.GOOGLE_MAPS_PLATFORM_API_KEY }}
      GOOGLE_ROUTES_API_KEY_SECRET: ${{ secrets.GOOGLE_ROUTES_API_KEY }}
      GOOGLE_MAPS_WEB_API_KEY_SECRET: ${{ secrets.GOOGLE_MAPS_WEB_API_KEY }}

    steps:
      - name: Select credentials without exposing values
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${SUPABASE_ACCESS_TOKEN_PRIMARY:-${SUPABASE_ACCESS_TOKEN_FALLBACK:-}}"
          MAPS_KEY="${GOOGLE_MAPS_PLATFORM_API_KEY_SECRET:-${GOOGLE_ROUTES_API_KEY_SECRET:-${GOOGLE_MAPS_WEB_API_KEY_SECRET:-}}}"
          test -n "$TOKEN" || { echo "Missing Supabase management token secret"; exit 2; }
          test -n "$MAPS_KEY" || { echo "Missing Google Maps/Routes secret"; exit 3; }
          echo "SUPABASE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "HML_MAPS_KEY=$MAPS_KEY" >> "$GITHUB_ENV"

      - name: Install Supabase CLI
        run: npm install --global supabase@latest

      - name: Configure Edge Function Google key on HML branch
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set \
            GOOGLE_MAPS_PLATFORM_API_KEY="$HML_MAPS_KEY" \
            GOOGLE_ROUTES_API_KEY="$HML_MAPS_KEY" \
            GOOGLE_MAPS_API_KEY="$HML_MAPS_KEY" \
            --project-ref "$HML_PROJECT_REF"
          echo "HML_GOOGLE_EDGE_SECRET_CONFIGURED"
