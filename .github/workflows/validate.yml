name: Validate APOIS

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validate-apois-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOOGLE_MAPS_WEB_API_KEY: ${{ secrets.GOOGLE_MAPS_WEB_API_KEY }}
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      VITE_PUBLIC_APP_URL: ${{ secrets.PASSENGER_PUBLIC_APP_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        shell: bash
        run: |
          set +e
          bun run typecheck 2>&1 | tee /tmp/apois-tsc.log
          status=${PIPESTATUS[0]}
          python3 - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(r'^(.*)\((\d+),(\d+)\): error (TS\d+): (.*)$')
          for raw in Path('/tmp/apois-tsc.log').read_text(errors='replace').splitlines():
              match = pattern.match(raw.strip())
              if not match:
                  continue
              path, line, col, code, message = match.groups()
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error file={path},line={line},col={col},title={code}::{message}')
          PY
          exit "$status"

      - name: Check Supabase push function
        run: deno check --node-modules-dir=auto supabase/functions/send-ride-push/index.ts

      - name: Validate reserved next-ride contract
        run: |
          grep -F 'queued_after_ride_id' src/types/rides/active-ride.ts
          grep -F 'queued_after_ride_id' src/services/rides/active-ride-service.ts
          grep -F 'Motorista reservado' src/components/rides/active/RideStatusHeader.tsx
          grep -F 'Sua corrida já está reservada.' 'src/routes/_authenticated.corrida.$rideId.tsx'

      - name: Validate no-driver terminal contract
        run: |
          grep -F '| "expired";' src/types/rides/active-ride.ts
          grep -F '"expired",' src/services/rides/active-ride-service.ts
          grep -F 'expired: 5' src/services/rides/active-ride-service.ts
          grep -F 'updatedRide.status === "expired"' src/hooks/rides/use-active-ride.tsx
          grep -F 'data.status !== "expired"' src/hooks/rides/use-active-ride.tsx
          grep -F 'case "expired":' src/components/rides/active/RideStatusHeader.tsx
          grep -F 'Nenhum motorista disponível' src/components/rides/active/RideStatusHeader.tsx

      - name: Reject source-mutating validation workflows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          offenders = []
          for path in Path('.github/workflows').glob('*.y*ml'):
              if path.name == 'validate.yml':
                  continue
              text = path.read_text(errors='ignore')
              if 'git push' in text or 'git commit' in text:
                  offenders.append(str(path))
          if offenders:
              raise SystemExit('Source-mutating validation workflows found: ' + ', '.join(offenders))
          PY

      - name: Validate PDF passenger checklist
        run: |
          test -f docs/qa/PASSENGER_PDF_CHECKLIST.md
          grep -F 'OQUE PRECISA TER NO APP DO MOTORISTA.pdf' docs/qa/PASSENGER_PDF_CHECKLIST.md

      - name: Validate Firebase passenger client
        run: |
          test -f android/app/google-services.json
          grep -F 'com.apois.passageiro' android/app/google-services.json

      - name: Lint critical passenger files
        run: |
          bun x eslint \
            src/hooks/rides/use-active-ride.tsx \
            src/hooks/rides/use-ride-request.tsx \
            src/services/rides/active-ride-service.ts \
            src/types/rides/active-ride.ts \
            src/types/rides/ride-request.ts \
            'src/routes/_authenticated.corrida.$rideId.tsx' \
            src/routes/_authenticated.revisar-solicitacao.tsx \
            src/components/payments/RidePixPaymentCard.tsx

      - name: Build web
        run: bun run build

      - name: Sync Capacitor Android
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: bunx cap sync android

      - name: Build Android debug APK
        working-directory: android
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: ./gradlew assembleDebug

      - name: Explain missing homologation keys
        if: ${{ env.GOOGLE_MAPS_WEB_API_KEY == '' || env.GOOGLE_MAPS_ANDROID_API_KEY == '' }}
        run: |
          echo "Homologation keys are not configured. APK artifact publication will be skipped."

      - name: Publish homologation APK
        if: ${{ env.GOOGLE_MAPS_WEB_API_KEY != '' && env.GOOGLE_MAPS_ANDROID_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: apois-passageiro-homologacao-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Full lint debt inventory
        if: always()
        continue-on-error: true
        run: bun run lint
