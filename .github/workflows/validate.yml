name: Validate APOIS

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/apois-auditoria-completa

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Lint corrected authentication and location files
        run: >-
          bunx eslint
          src/hooks/use-auth.tsx
          src/hooks/use-location.tsx
          src/routes/_authenticated.perfil.tsx

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_validation_placeholder
          VITE_GOOGLE_MAPS_API_KEY: ci_validation_placeholder

      - name: Full lint debt inventory
        continue-on-error: true
        run: bun run lint
