name: Validate APOIS

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/apois-auditoria-completa
      - feat/apois-passageiro-completo

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Lint critical passenger files
        run: >-
          bunx eslint
          src/components/app/AppBrand.tsx
          src/components/app/PrimaryButton.tsx
          src/components/app/PublicAuthShell.tsx
          src/components/auth/AuthGuard.tsx
          src/components/BottomNavigation.tsx
          src/components/notifications/PushStatusCard.tsx
          src/hooks/use-auth.tsx
          src/hooks/use-location.tsx
          src/hooks/use-push-notifications.tsx
          src/lib/auth/password-recovery.ts
          src/routes/_public.login.tsx
          src/routes/_public.cadastro.tsx
          src/routes/_public.recuperar-senha.tsx
          src/routes/_authenticated.perfil.tsx

      - name: Build web
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_validation_placeholder
          VITE_GOOGLE_MAPS_API_KEY: ci_validation_placeholder
          VITE_PUBLIC_APP_URL: https://passageiro.apois.example

      - name: Sync Capacitor Android
        run: |
          printf 'GOOGLE_MAPS_API_KEY=ci_validation_placeholder\n' > android/local.properties
          bunx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publish homologation APK
        uses: actions/upload-artifact@v4
        with:
          name: APOIS-Passageiro-Homologacao
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Full lint debt inventory
        continue-on-error: true
        run: bun run lint
