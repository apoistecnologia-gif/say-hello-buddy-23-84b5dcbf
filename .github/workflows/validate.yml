name: Validate APOIS

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/apois-auditoria-completa
      - feat/push-notifications-producao

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Validate Supabase migration names and timestamps
        shell: bash
        run: |
          set -euo pipefail

          migrations_dir="supabase/migrations"
          if [ ! -d "$migrations_dir" ]; then
            echo "Diretório de migrations não encontrado: $migrations_dir"
            exit 1
          fi

          mapfile -t files < <(find "$migrations_dir" -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nenhuma migration SQL encontrada."
            exit 1
          fi

          timestamps=()
          for file in "${files[@]}"; do
            if [[ ! "$file" =~ ^([0-9]{14})_([a-z0-9]+([_-][a-z0-9]+)*)\.sql$ ]]; then
              echo "Nome de migration inválido: $file"
              exit 1
            fi

            timestamp="${BASH_REMATCH[1]}"
            description="${BASH_REMATCH[2]}"

            if ! date -u -d "${timestamp:0:4}-${timestamp:4:2}-${timestamp:6:2} ${timestamp:8:2}:${timestamp:10:2}:${timestamp:12:2}" '+%Y%m%d%H%M%S' >/tmp/normalized_timestamp 2>/dev/null; then
              echo "Timestamp impossível em migration: $file"
              exit 1
            fi

            normalized="$(cat /tmp/normalized_timestamp)"
            if [ "$normalized" != "$timestamp" ]; then
              echo "Timestamp não normalizado em migration: $file"
              exit 1
            fi

            if [ "${#description}" -lt 3 ]; then
              echo "Descrição muito curta em migration: $file"
              exit 1
            fi

            if [[ "$description" == *"__"* || "$description" == *"--"* ]]; then
              echo "Separadores duplicados em migration: $file"
              exit 1
            fi

            if [ ! -s "$migrations_dir/$file" ]; then
              echo "Migration vazia: $file"
              exit 1
            fi

            if ! grep -Eqi '(^|[[:space:]])(SELECT|WITH|BEGIN;|COMMIT;|CREATE|ALTER|DROP|INSERT|UPDATE|DELETE|MERGE|GRANT|REVOKE|COMMENT|DO[[:space:]]+\$\$|CALL|EXECUTE|SET|RESET|ANALYZE)' "$migrations_dir/$file"; then
              echo "Migration sem comando SQL reconhecível: $file"
              exit 1
            fi

            if grep -Eqi '^[[:space:]]*(TRUNCATE[[:space:]]+|DROP[[:space:]]+DATABASE|DROP[[:space:]]+SCHEMA[[:space:]]+(public|auth)([[:space:]]|;))' "$migrations_dir/$file"; then
              echo "Comando destrutivo proibido em migration: $file"
              exit 1
            fi

            timestamps+=("$timestamp")
          done

          duplicates="$(printf '%s\n' "${timestamps[@]}" | sort | uniq -d)"
          if [ -n "$duplicates" ]; then
            echo "Timestamps duplicados encontrados nas migrations:"
            echo "$duplicates"
            exit 1
          fi

      - name: Lint corrected authentication and location files
        run: >-
          bunx eslint
          src/hooks/use-auth.tsx
          src/hooks/use-location.tsx
          src/routes/_authenticated.perfil.tsx

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_validation_placeholder
          VITE_GOOGLE_MAPS_API_KEY: ci_validation_placeholder

      - name: Full lint debt inventory
        continue-on-error: true
        run: bun run lint
