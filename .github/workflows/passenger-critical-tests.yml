name: Passenger Critical Tests

on:
  push:
    branches:
      - test/passenger-critical-flows
  pull_request:
    branches:
      - feat/apois-passageiro-completo

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_validation_placeholder
          VITE_SUPABASE_PROJECT_ID: example-project
          VITE_APOIS_API_URL: https://example.supabase.co/functions/v1
          VITE_GOOGLE_MAPS_API_KEY: ci_validation_placeholder
