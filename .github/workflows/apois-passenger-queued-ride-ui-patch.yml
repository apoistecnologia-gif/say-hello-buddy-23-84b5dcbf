name: APOIS Passageiro - corrida reservada

on:
  push:
    branches:
      - feat/apois-passageiro-completo
    paths:
      - ".github/workflows/apois-passenger-queued-ride-ui-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/apois-passageiro-completo
      - name: Adaptar contrato e tela de corrida
        run: |
          python - <<'PY'
          from pathlib import Path

          # service: normaliza queued fields e permite contato com motorista reservado
          p=Path('src/services/rides/active-ride-service.ts')
          s=p.read_text()
          old='''  | "completed_at"\n  | "share_token";'''
          new='''  | "completed_at"\n  | "share_token"\n  | "queued_after_ride_id"\n  | "queued_at";'''
          assert old in s
          s=s.replace(old,new,1)

          old='''      ["completed_at", "completed_at"],\n      ["share_token", "share_token"],'''
          new='''      ["completed_at", "completed_at"],\n      ["share_token", "share_token"],\n      ["queued_after_ride_id", "queued_after_ride_id"],\n      ["queued_at", "queued_at"],'''
          assert old in s
          s=s.replace(old,new,1)

          old='''      canContactDriver:\n        Boolean(ride.driver_id) &&\n        ["motorista_a_caminho", "motorista_chegou", "em_viagem"].includes(status),'''
          new='''      canContactDriver:\n        Boolean(ride.driver_id) &&\n        (["motorista_a_caminho", "motorista_chegou", "em_viagem"].includes(status) ||\n          (status === "procurar_motorista" && Boolean(ride.queued_after_ride_id))),'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          # status header: mensagem especial sem inventar novo status do backend
          p=Path('src/components/rides/active/RideStatusHeader.tsx')
          s=p.read_text()
          old='''  estimatedArrivalMinutes?: number | null | undefined;\n}'''
          new='''  estimatedArrivalMinutes?: number | null | undefined;\n  isQueuedRide?: boolean | undefined;\n}'''
          assert old in s
          s=s.replace(old,new,1)
          old='''  estimatedArrivalMinutes,\n}: RideStatusHeaderProps) {'''
          new='''  estimatedArrivalMinutes,\n  isQueuedRide = false,\n}: RideStatusHeaderProps) {'''
          assert old in s
          s=s.replace(old,new,1)
          old='''      case "procurar_motorista":\n        return {\n          title: "Procurando motorista",\n          subtitle: "A solicitação está sendo enviada aos motoristas disponíveis.",\n          icon: <Search className="animate-pulse text-apois-yellow" size={20} />,\n          color: "bg-apois-yellow/10 border-apois-yellow/20",\n        };'''
          new='''      case "procurar_motorista":\n        if (isQueuedRide) {\n          return {\n            title: "Motorista reservado",\n            subtitle: "Ele está concluindo uma corrida próxima. Assim que finalizar, seguirá para o seu embarque.",\n            icon: <Navigation className="text-apois-yellow" size={20} />,\n            color: "bg-apois-yellow/10 border-apois-yellow/20",\n          };\n        }\n        return {\n          title: "Procurando motorista",\n          subtitle: "A solicitação está sendo enviada aos motoristas disponíveis.",\n          icon: <Search className="animate-pulse text-apois-yellow" size={20} />,\n          color: "bg-apois-yellow/10 border-apois-yellow/20",\n        };'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          # mapa: não mostra posição congelada do motorista enquanto ele conclui outra corrida
          p=Path('src/components/map/ActiveRideMap.tsx')
          s=p.read_text()
          old='''  const driverLocation = useMemo<Coordinate | null>(() => {\n    if (\n      typeof ride.driver_latitude !== "number" ||'''
          new='''  const driverLocation = useMemo<Coordinate | null>(() => {\n    if (ride.queued_after_ride_id) return null;\n    if (\n      typeof ride.driver_latitude !== "number" ||'''
          assert old in s
          s=s.replace(old,new,1)
          old='], [ride.driver_latitude, ride.driver_longitude]);'
          new='], [ride.driver_latitude, ride.driver_longitude, ride.queued_after_ride_id]);'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          # tela ativa: deriva estado reservado, mostra motorista/veículo e não mostra busca genérica
          p=Path('src/routes/_authenticated.corrida.$rideId.tsx')
          s=p.read_text()
          old='''  if (!ride || !status) return null;\n\n  return ('''
          new='''  if (!ride || !status) return null;\n\n  const isQueuedRide =\n    status === "procurar_motorista" &&\n    Boolean(ride.driver_id && ride.queued_after_ride_id);\n\n  return ('''
          assert old in s
          s=s.replace(old,new,1)

          old='''          <RideStatusHeader status={status} isRefreshing={isRefreshing} />'''
          new='''          <RideStatusHeader status={status} isRefreshing={isRefreshing} isQueuedRide={isQueuedRide} />'''
          assert old in s
          s=s.replace(old,new,1)

          old='''            {status !== "procurar_motorista" && status !== "agendada" ? ('''
          new='''            {(isQueuedRide || (status !== "procurar_motorista" && status !== "agendada")) ? ('''
          assert old in s
          s=s.replace(old,new,1)

          old='''            {status === "procurar_motorista" ? ('''
          new='''            {status === "procurar_motorista" && !isQueuedRide ? ('''
          assert old in s
          s=s.replace(old,new,1)

          marker='''            {screenState === "completed" || screenState === "cancelled" ? ('''
          queued='''            {isQueuedRide ? (\n              <div className="rounded-2xl border border-apois-yellow/20 bg-apois-yellow/10 p-4">\n                <p className="text-[10px] font-black uppercase tracking-[0.16em] text-apois-yellow">Motorista confirmado</p>\n                <p className="mt-2 text-sm font-black text-white">Sua corrida já está reservada.</p>\n                <p className="mt-1 text-[11px] font-medium leading-5 text-zinc-400">\n                  O motorista está finalizando uma viagem próxima. Você poderá acompanhar a aproximação assim que ele iniciar o deslocamento até o embarque.\n                </p>\n              </div>\n            ) : null}\n\n'''
          assert marker in s
          s=s.replace(marker,queued+marker,1)
          p.write_text(s)
          PY
      - name: Validar patch
        run: |
          grep -q 'queued_after_ride_id' src/services/rides/active-ride-service.ts
          grep -q 'Motorista reservado' src/components/rides/active/RideStatusHeader.tsx
          grep -q 'isQueuedRide' 'src/routes/_authenticated.corrida.$rideId.tsx'
          grep -q 'ride.queued_after_ride_id' src/components/map/ActiveRideMap.tsx
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/rides/active-ride-service.ts src/components/rides/active/RideStatusHeader.tsx src/components/map/ActiveRideMap.tsx 'src/routes/_authenticated.corrida.$rideId.tsx'
          git commit -m "feat(passageiro): mostrar motorista reservado para próxima corrida"
          git push origin HEAD:feat/apois-passageiro-completo
