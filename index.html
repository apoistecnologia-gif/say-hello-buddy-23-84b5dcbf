    <meta name="twitter:title" content="APOIS Passageiro" />

    <!--
      APOIS observability (Better Stack)
      Disabled by default. Vite only enables the loader when VITE_BETTERSTACK_TOKEN
      is provided by the build environment. No token is stored in this repository.
    -->
    <script>
      (() => {
        const token = "%VITE_BETTERSTACK_TOKEN%";

        if (!token || token.includes("VITE_BETTERSTACK_TOKEN")) {
          return;
        }

        !(function (b, e, t, r) {
          b[t] =
            b[t] ||
            function (...args) {
              (b[t].q = b[t].q || []).push(args);
            };
          b[t].l = +new Date();
          const script = e.createElement("script");
          script.async = true;
          script.crossOrigin = "anonymous";
          script.src = `https://betterstack.net/b.js?t=${encodeURIComponent(r)}`;
          (e.head || e.getElementsByTagName("head")[0]).appendChild(script);
        })(window, document, "betterstack", token);

        window.betterstack("config", {
          sentry: {
            sendDefaultPii: false,
          },
        });
        window.betterstack("init");
      })();
    </script>
  </head>
  <body class="bg-black">
    <div id="root">
      <div
        id="apois-fallback-loading"
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          background: black;
          color: white;
          font-family: sans-serif;
        "
      >
        <p
          style="
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-size: 14px;
            color: #ffb800;
          "
        >
          Carregando APOIS...
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
