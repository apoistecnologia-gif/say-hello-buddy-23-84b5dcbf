apply plugin: 'com.android.application'

def observabilityBuild = project.findProperty('APOIS_OBSERVABILITY') == 'true'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def googleMapsApiKey = localProperties.getProperty('GOOGLE_MAPS_API_KEY') ?: "MISSING_KEY"
def apoisBrandSource = rootProject.file('../src/assets/logo.jpg')
def apoisBrandTargetDir = file('src/main/res/drawable-nodpi')
def apoisBrandTarget = new File(apoisBrandTargetDir, 'apois_brand_logo.jpg')

tasks.register('prepareApoisBranding') {
    inputs.file(apoisBrandSource)
    outputs.file(apoisBrandTarget)

    doLast {
        if (!apoisBrandSource.exists()) {
            throw new GradleException("Logo oficial da APOIS não encontrada em src/assets/logo.jpg")
        }

        apoisBrandTargetDir.mkdirs()
        copy {
            from apoisBrandSource
            into apoisBrandTargetDir
            rename { 'apois_brand_logo.jpg' }
        }
    }
}

android {
    namespace = "com.apois.passageiro"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.apois.passageiro"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders = [GOOGLE_MAPS_API_KEY: googleMapsApiKey]

        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            if (observabilityBuild) {
                applicationIdSuffix ".observability"
                versionNameSuffix "-observability"
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        if (googleMapsApiKey == "MISSING_KEY") {
            println("WARNING: GOOGLE_MAPS_API_KEY not found in local.properties")
        }
        if (observabilityBuild) {
            println("APOIS observability build enabled: ${variant.applicationId}")
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareApoisBranding')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$espressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

if (!observabilityBuild) {
    try {
        def servicesJSON = file('google-services.json')
        if (servicesJSON.text) {
            apply plugin: 'com.google.gms.google-services'
        }
    } catch(Exception e) {
        logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
    }
} else {
    logger.lifecycle("APOIS observability build: Firebase/Google Services plugin intentionally disabled")
}
